# Pings your Render-hosted service(s) on a schedule so Render's free-tier
# instances (which spin down after ~15 minutes of no inbound traffic, then
# take 30-60s to cold-start on the next real request) never go idle.
#
# Setup (one-time):
#   1. GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables tab
#   2. New repository variable named RENDER_KEEPALIVE_URLS
#   3. Value = one health-check URL per line, e.g.:
#        https://nexora-core-api.onrender.com/api/v1/health
#        https://sapok-ai-api.onrender.com/api/v1/health
#        https://sapok-pay-api.onrender.com/api/v1/health
#      (use whichever of your Render URLs are actually deployed — this
#      workflow does nothing if the variable is unset)
#
# You can also trigger a run manually from the Actions tab (workflow_dispatch)
# to test it without waiting for the schedule.
#
# Reliability note: GitHub free-tier scheduled workflows are "best effort" —
# under heavy platform load a run can be delayed by several minutes, and
# a repo with very little other activity can occasionally have a run
# skipped. */10 leaves comfortable margin under Render's ~15 minute
# spin-down window, but if you need guaranteed-exact timing, pair this
# with (or replace it with) a free external monitor like UptimeRobot or
# cron-job.org instead — they ping from outside GitHub's scheduler entirely.

name: Keep Render services alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping configured URLs
        env:
          URLS: ${{ vars.RENDER_KEEPALIVE_URLS }}
        run: |
          if [ -z "$URLS" ]; then
            echo "RENDER_KEEPALIVE_URLS repository variable is not set — nothing to ping. See this workflow's header comment for setup."
            exit 0
          fi

          while IFS= read -r url; do
            url="$(echo "$url" | xargs)"
            [ -z "$url" ] && continue

            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "OK   $code  $url"
            else
              # Logged, not failed — a Render cold start or a transient
              # blip shouldn't spam failure notifications; the log line
              # above is what actually matters here.
              echo "FAIL $code  $url"
            fi
          done <<< "$URLS"
