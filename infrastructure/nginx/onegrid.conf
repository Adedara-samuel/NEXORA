# Sapok OneGrid — reverse proxy for a self-hosted, single-VPS deployment.
#
# This is the ALTERNATIVE deployment path, not the one this project actually
# uses today: Control Center deploys to Vercel and Core API to Render, and
# both already terminate TLS and route traffic themselves — nginx has
# nothing to do in that setup. This file is for someone choosing to run
# everything on their own VPS instead (see README.md's "Deployment"
# section), where nothing else is doing TLS termination, routing or
# edge rate-limiting for them.
#
# Assumes:
#   - Core API running on 127.0.0.1:4000 (pnpm --filter @nexora/core-api start,
#     or the Docker image, published to that port on the same host)
#   - Control Center running on 127.0.0.1:3000 (`next start`, NOT the Vercel
#     deployment — this file is only relevant if you're self-hosting that too)
#   - Certificates issued by certbot at the standard
#     /etc/letsencrypt/live/<domain>/ path (`certbot --nginx -d your-domain`)
#
# Install: copy this file to /etc/nginx/sites-available/onegrid.conf,
# replace every `your-domain.example` below with your real domain, symlink
# it into sites-enabled, then `nginx -t && systemctl reload nginx`.

# Edge rate limiting — a coarser, network-level backstop in front of the
# API's own per-route @Throttle() decorators (login is already limited to
# 5/min at the application level; this catches abusive traffic before it
# even reaches Node).
limit_req_zone $binary_remote_addr zone=onegrid_api:10m rate=20r/s;

upstream onegrid_core_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

upstream onegrid_control_center {
  server 127.0.0.1:3000;
  keepalive 32;
}

# Plain HTTP: redirect everything to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name your-domain.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name your-domain.example;

  ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # helmet() already sets most of these at the application layer (see
  # services/core-api/src/main.ts) — repeated here so they also cover
  # Control Center's own responses, which helmet() never touches.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  gzip on;
  gzip_types text/plain application/json application/javascript text/css;
  gzip_min_length 1024;

  client_max_body_size 10m;

  # Core API — everything under /api/ (matches API_GLOBAL_PREFIX=api/v1).
  location /api/ {
    limit_req zone=onegrid_api burst=40 nodelay;

    proxy_pass http://onegrid_core_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Everything else — Control Center (Next.js).
  location / {
    proxy_pass http://onegrid_control_center;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js's dev-server hot-reload websocket — harmless to keep in
    # production, only ever used if NODE_ENV isn't actually "production".
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
